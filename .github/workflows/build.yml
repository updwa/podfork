name: Build Podkop IPK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Поддерживаемые архитектуры OpenWrt (добавляйте по мере необходимости)
        target: [x86_64]
        arch: [x86_64]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up OpenWrt Buildroot
        uses: openwrt-actions/buildroot@v2
        with:
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          
      - name: Copy package sources
        run: |
          mkdir -p package/feeds/packages/podkop
          cp -r podkop/* package/feeds/packages/podkop/

      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure build
        run: |
          make defconfig
          make package/podkop/compile V=s

      - name: Locate built IPK
        id: locate
        run: |
          IPK_PATH="$(find bin/packages -name 'podkop_*.ipk' | head -n1)"
          echo "ipk_path=$IPK_PATH" >> $GITHUB_OUTPUT

      - name: Create Release (if tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.locate.outputs.ipk_path }}
          generate_release_notes: true

      - name: Upload IPK as artifact (for testing)
        uses: actions/upload-artifact@v4
        with:
          name: podkop-ipk-${{ matrix.arch }}
          path: ${{ steps.locate.outputs.ipk_path }}
